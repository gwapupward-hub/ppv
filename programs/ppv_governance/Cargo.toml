[package]
name = "ppv_governance"
version = "0.1.0"
description = "Native multisig upgrade governance for PPV programs"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "ppv_governance"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
