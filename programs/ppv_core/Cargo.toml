[package]
name = "ppv_core"
version = "0.1.0"
description = "Non-custodial proof registry for Private Proof Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ppv_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["event-cpi"] }
