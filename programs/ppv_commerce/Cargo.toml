[package]
name = "ppv_commerce"
version = "0.1.0"
description = "Exact-version bilateral agreements for PPV"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "ppv_commerce"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Declared so the cfg checks Anchor and solana-program expand into this
# crate resolve. Never enabled by a build; enabling them is opt-in.
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
