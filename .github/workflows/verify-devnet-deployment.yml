name: Verify devnet deployment

# Re-verifies an already-deployed PPV program against its committed release
# record. This is deliberately separate from the initial-deployment workflow and
# shares no step with it.
#
# ZERO MUTATIONS. There is no `solana program deploy`, `write`, `upgrade`,
# `set-upgrade-authority`, `close`, `transfer`, or any other command that can
# sign or submit a transaction — the only chain access in this workflow is
# `getGenesisHash`, `getAccountInfo` and `getSignatureStatuses` over public
# JSON-RPC. It uses no repository secrets, no program keypair, no deployer
# keypair and no Squads member key, because every fact it checks is public.
#
# It fails closed: any mismatch between the record and the chain fails the run,
# and a cluster that is not the recorded one is refused before anything else.

on:
  workflow_dispatch:
    inputs:
      record:
        description: "One evidence record to verify; empty means every committed record"
        required: false
        default: ""
        type: string
      verify_rpc_url:
        description: Optional second RPC endpoint for an independent read
        required: false
        default: ""
        type: string
  schedule:
    # Weekly, so a change to the live upgrade authority or the deployed bytes is
    # noticed by the repository rather than by whoever happens to look.
    - cron: "17 7 * * 1"
  pull_request:
    paths:
      - deployments/evidence/**
      - scripts/verify-deployed-program.mjs
      - scripts/collect-deployment-evidence.mjs
      - scripts/lib/rpc.mjs
      - .github/workflows/verify-devnet-deployment.yml

permissions:
  contents: read

concurrency:
  group: verify-devnet-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deployed PPV programs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PPV_RPC_URL: https://api.devnet.solana.com
      PPV_VERIFY_RPC_URL: ${{ inputs.verify_rpc_url }}
      RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The zero-mutation and no-secrets properties of this file are asserted by
      # scripts/test/workflow.test.mjs, so adding a deploy step, a keypair or a
      # `secrets.` reference here breaks a test rather than passing quietly.

      # Every committed record, not one named record. A program released later
      # is verified from the commit its record lands in, with nobody having to
      # remember to add it here — and a record that stops verifying fails this
      # run whichever program it belongs to.
      - name: Verify every release record against live chain state
        run: |
          if [[ -n "${RECORD}" ]]; then
            node scripts/verify-deployed-program.mjs "${RECORD}"
            exit 0
          fi
          shopt -s nullglob
          records=(deployments/evidence/*.json)
          if (( ${#records[@]} == 0 )); then
            echo "No committed release records to verify." >&2
            exit 1
          fi
          failed=0
          for record in "${records[@]}"; do
            echo "::group::${record}"
            node scripts/verify-deployed-program.mjs "${record}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"

      # Reported, not asserted. A program with no release record has nothing to
      # verify against, and the useful question before its first deployment is
      # simply whether its permanent address is still free. Read-only, and
      # informational only, so it can never fail this workflow.
      - name: Report the live state of every permanent PPV program
        run: |
          for id in 9cWE41ZDNQChvFrRoVuPQDeoVLg46ACTiZRCZaBZzfwU \
                    GmRDoFuPrBrsxnvTX751WK5rLu14JXe4sgjh6vNwHzr3; do
            node scripts/verify-deployed-program.mjs --inspect "${id}"
          done

      - name: Verify live PPV Core identity and custody through the smoke suite
        run: |
          npm ci
          npm run build:sdk --silent
          node scripts/devnet-smoke.mjs --identity-only
        env:
          PPV_SMOKE_RPC_URL: https://api.devnet.solana.com
          PPV_SQUADS_VAULT_PDA: B6tcsTrMCKTZV5vi3rRCnA3FMPeeWACSHuuTSz5XQgnX
