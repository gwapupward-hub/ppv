name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:sdk

  programs:
    name: Solana programs (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy --toolchain 1.85.1
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked

  anchor:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Anchor local validator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          # Anchor 0.30.1's locked `time` dependency predates Rust 1.80.
          rustup toolchain install 1.79.0 --profile minimal
      - name: Install Solana CLI 1.18.17
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/solana" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"
          "${solana_bin}/solana" --version
      - name: Install Anchor CLI 0.30.1
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] || \
             [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install \
              --git https://github.com/solana-foundation/anchor \
              --tag v0.30.1 \
              anchor-cli \
              --locked \
              --force
          fi
          "${HOME}/.cargo/bin/anchor" --version
      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v2
      - name: Resolve an SBF-compatible lockfile
        run: |
          rm Cargo.lock
          cargo +1.85.1 generate-lockfile
          # Cargo's MSRV fallback cannot protect against crates that omit or
          # understate rust-version. Use Solana 1.18.17's own lockfile as the
          # compatibility baseline for the affected transitive families.
          cargo +1.85.1 update -p solana-program --precise 1.18.17
          cargo +1.85.1 update -p blake3 --precise 1.5.0
          cargo +1.85.1 update -p cc --precise 1.0.83
          cargo +1.85.1 update -p serde --precise 1.0.195
          cargo +1.85.1 update -p serde_json --precise 1.0.111
          cargo +1.85.1 update -p bytemuck --precise 1.14.0
          cargo +1.85.1 update -p bytemuck_derive --precise 1.4.0
          cargo +1.85.1 update -p borsh@1.5.7 --precise 1.2.1
          echo "PPV_CARGO_LOCK_B64=$(base64 --wrap=0 Cargo.lock)"
      - run: npm ci
      - name: Build twice, compare IDLs, and run validator tests
        run: npm run test:f1
