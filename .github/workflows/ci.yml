name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  # The release-tier invariant gate is expensive enough that running it on every
  # pull request would push the Anchor job past the point where anyone waits for
  # it. It runs weekly and on demand instead, so the gate exists and is
  # runnable before a release rather than being a paragraph in a document.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      invariant_tier:
        description: Invariant budget to run (pr or release)
        required: false
        default: release
        type: choice
        options: [pr, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  programs:
    name: Solana programs (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy --toolchain 1.85.1
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked

  anchor:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Anchor local validator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          # Anchor 0.30.1's locked `time` dependency predates Rust 1.80, so the
          # CLI itself is built with 1.79.0.
          rustup toolchain install 1.79.0 --profile minimal
          # Anchor 0.30.1 builds the IDL with `cargo +nightly` and anchor-syn
          # calls proc_macro2::Span::source_file(), an unstable API later
          # nightlies removed. scripts/verify-f1.sh pins this nightly so the IDL
          # build fails on a code change, never on a date.
          rustup toolchain install nightly-2024-06-15 --profile minimal
      - name: Install Solana CLI 1.18.17
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/solana" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"
          "${solana_bin}/solana" --version
      - name: Install Anchor CLI 0.30.1
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] || \
             [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install \
              --git https://github.com/solana-foundation/anchor \
              --tag v0.30.1 \
              anchor-cli \
              --locked \
              --force
          fi
          "${HOME}/.cargo/bin/anchor" --version
      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3
      - name: Assert the committed lockfile is authoritative
        run: |
          # The committed Cargo.lock is the single source of truth. CI never
          # mutates it: `--locked` makes cargo fail rather than silently
          # re-resolve, so a drifting crates.io index cannot change what the
          # SBF toolchain builds. Regenerate deliberately with
          # ./scripts/regenerate-lockfile.sh and commit the result.
          cargo +1.85.1 metadata --locked --format-version 1 > /dev/null
      - run: npm ci
      - name: Build twice, compare IDLs, and run validator tests
        run: npm run test:f1
      # The security-invariant gate runs only after deterministic correctness is
      # established: a property harness pointed at a program whose fixed tests
      # are already red reports noise, not findings.
      #
      # Budget defaults to the PR tier — 100 sequences of up to 20 actions
      # across three fixed seeds, with a floor of 2,000 attempted operations
      # asserted by the suite itself. A scheduled or dispatched run raises it to
      # the release budget: 200 sequences of up to 32 actions across five seeds,
      # floor 12,000.
      - name: Detect a declared release candidate
        id: candidate
        run: |
          # Presence, not a diff. The first version of this asked git whether
          # the pull request touched deployments/release-candidates/, which on
          # a shallow checkout fails with "no merge base" — and because the
          # command sat inside an `if`, the failure answered "no" instead of
          # aborting. The gate silently downgraded itself to the PR budget on
          # the very change that declared a release. A security gate that fails
          # open is worse than no gate, because it reports success.
          #
          # Asking whether the file exists needs no git history, no network and
          # no base branch, so there is nothing left to fail. It is also the
          # better rule: while a program is queued for release, every commit is
          # a candidate for the commit that gets deployed, and all of them
          # should be held to the release budget. The file is deleted when the
          # release record lands.
          shopt -s nullglob
          candidates=(deployments/release-candidates/*.json)
          declared=false
          (( ${#candidates[@]} > 0 )) && declared=true
          echo "release_candidate=${declared}" >> "${GITHUB_OUTPUT}"
          echo "release candidate declared: ${declared} (${candidates[*]:-none})"

      - name: Security invariants (PPV-P1..P10, property-based)
        env:
          TIER: >-
            ${{ inputs.invariant_tier
                || (github.event_name == 'schedule' && 'release')
                || (steps.candidate.outputs.release_candidate == 'true' && 'release')
                || 'pr' }}
        run: |
          echo "invariant tier: ${TIER}"
          npm run "test:invariants:${TIER}"
      - name: Assert the build did not rewrite the lockfile
        run: git diff --exit-code -- Cargo.lock

  property-mutation:
    # RR-8: proving the randomized suite detects injected custody defects.
    #
    # Its own job rather than more steps on `anchor`, because it rebuilds the
    # program once per mutation and runs the property suite five times. Bolted
    # onto a job already spending forty minutes on the release tier it would
    # push the whole thing past the point where anyone waits for it, and a gate
    # developers route around is not a gate.
    #
    # Same trigger set as the release tier: this answers a release question,
    # and answering it on every push would cost more than it is worth.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Property-suite mutation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          # Anchor 0.30.1's locked `time` dependency predates Rust 1.80, so the
          # CLI itself is built with 1.79.0.
          rustup toolchain install 1.79.0 --profile minimal
          # Anchor 0.30.1 builds the IDL with `cargo +nightly` and anchor-syn
          # calls proc_macro2::Span::source_file(), an unstable API later
          # nightlies removed. scripts/verify-f1.sh pins this nightly so the IDL
          # build fails on a code change, never on a date.
          rustup toolchain install nightly-2024-06-15 --profile minimal
      - name: Install Solana CLI 1.18.17
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/solana" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"
          "${solana_bin}/solana" --version
      - name: Install Anchor CLI 0.30.1
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] || \
             [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install \
              --git https://github.com/solana-foundation/anchor \
              --tag v0.30.1 \
              anchor-cli \
              --locked \
              --force
          fi
          "${HOME}/.cargo/bin/anchor" --version
      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3
      - run: npm ci
      - name: Break one defence at a time and require the property suite to fail
        run: ./scripts/mutation-qualify-property.sh
      - name: Assert no mutation survived into the working tree
        run: git diff --exit-code -- programs/
