name: PPV Protocol CI

on:
  push:
    branches: [main, feature/solana-founding-beta]
  pull_request:

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust bootstrap toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Solana 1.18.17
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor 0.30.1
        shell: bash
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install 0.30.1
          avm use 0.30.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          rustup default 1.79.0
      - name: Install test dependencies
        run: npm install
      - name: Generate Anchor-compatible lockfile
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          head -n 4 Cargo.lock
      - name: First build and synchronize ephemeral program ID
        shell: bash
        run: |
          anchor build
          anchor keys sync
          anchor build
      - name: SDK tests
        run: npm run test:sdk
      - name: Anchor tests
        run: anchor test --skip-build
