name: Live DEVNET custody validation (ppv_escrow)

# Manual only, and deliberately so.
#
# This is the one PPV workflow that sends value-moving transactions against a
# deployed program. There is no `push`, no `pull_request` and no `schedule`
# trigger here by design: a custody run must be something a person decided to
# do, not a side effect of merging code or of a clock. `scripts/test/
# escrow-custody-workflow.test.mjs` asserts that property against this file, so
# a future edit that adds an automatic trigger fails the suite rather than
# quietly turning custody testing into CI.
#
# What it does:
#
#   * refuses any cluster that is not devnet, by genesis hash, before a keypair
#     is loaded or an instruction is built — mainnet by name first;
#   * creates disposable wallets and a disposable Classic SPL Token mint with no
#     economic value whatsoever;
#   * runs the full escrow custody scenario matrix and its negative suite;
#   * reconstructs every history from the chain and checks it against live
#     account state;
#   * writes one public evidence record containing addresses, signatures and
#     balances, and refuses to serialize anything key-shaped.
#
# What it cannot do:
#
#   * deploy, upgrade, close, or set the upgrade authority of any program. It
#     runs one script, and that script calls no loader instruction.
#   * touch mainnet. There is no endpoint input; the RPC URL comes from a
#     protected-environment secret, and the harness refuses a mainnet genesis
#     hash regardless — genesis is what binds, not the URL.
#   * open the custody gate. RR-13 and legal review are unaffected by a passing
#     run, and the evidence record says so in its own gates block.
#
# The funder secret is a disposable devnet wallet that pays rent and fees for
# the throwaway wallets each run creates. It is not the deployer, it holds no
# authority over anything, and the harness only ever reads it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ppv_escrow to confirm a live devnet custody run
        required: true
        type: string
      preflight_only:
        description: "Run the read-only preflight and stop before any transaction"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One custody run at a time. Two concurrent runs would share the funder
  # wallet and race on its balance and blockhashes.
  group: devnet-escrow-custody-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Live devnet custody validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: devnet-custody-validation
    env:
      # A DEDICATED devnet endpoint, supplied by the protected environment. Not
      # an input, because an endpoint input is the one thing that could point
      # this at another cluster; and no longer the shared public endpoint,
      # because that endpoint's rate limiter killed run 35405785493 after its
      # disposable setup had already been created and paid for.
      #
      # It may carry an API key, so nothing prints it: the harness registers it
      # as sensitive before building a client, every message this repository
      # writes says "the configured RPC endpoint" instead, and messages from
      # web3.js or undici are scrubbed on the way out. It is absent from the
      # evidence record by construction — the cluster is named by genesis hash.
      #
      # Devnet is still proved by genesis hash against the live cluster, which
      # is the check that actually binds; a secret URL is trusted for nothing.
      PPV_CUSTODY_RPC_URL: ${{ secrets.PPV_CUSTODY_RPC_URL }}

    steps:
      - name: Confirm the run
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "ppv_escrow" ]; then
            echo "confirmation did not match ppv_escrow; refusing" >&2
            exit 1
          fi

      - name: Require the dedicated devnet RPC endpoint
        # First, before checkout, before npm, before the funder secret is read
        # and long before an instruction is built. A run that discovers this
        # late has already spent time; a run that falls back to the shared
        # public endpoint has already spent devnet SOL.
        #
        # Presence only. The value is never echoed, never traced, and never
        # compared against anything that would reveal it.
        run: |
          set -euo pipefail
          if [ -z "${PPV_CUSTODY_RPC_URL:-}" ]; then
            echo "::error::DEDICATED_DEVNET_RPC=MISSING" >&2
            echo "::error::Configure the PPV_CUSTODY_RPC_URL secret on the" \
                 "devnet-custody-validation environment with a dedicated devnet endpoint." \
                 "This workflow has no fallback: the shared public endpoint rate-limited" \
                 "run 35405785493 mid-run." >&2
            exit 1
          fi
          echo "DEDICATED_DEVNET_RPC=CONFIGURED"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history, because the deterministic step below runs the release
          # suite, and part of that suite reads the repository's own past: the
          # Escrow provenance tests `git show` the release commit 231dceb and
          # the evidence-tooling commit 1b9d4c1 to prove the two really are
          # different code.
          #
          # Under `actions/checkout`'s default depth of 1 those objects are
          # simply absent, and the failure presents as a broken provenance test
          # rather than as a missing clone — which is exactly how run
          # 35182967665 failed, before it had read a single account or sent a
          # single transaction.
          #
          # Guarded by scripts/test/escrow-provenance-closeout-workflow.test.mjs,
          # which now asserts this against every workflow that runs the suite
          # rather than against ci.yml alone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the SDK and indexer the harness reads through
        run: npm run build

      - name: Deterministic harness checks
        # The offline suite before the live one. Every refusal the live run will
        # never take — mainnet, a wrong authority, a wrong binary, a wrong
        # threshold, a refusal that changed something, an evidence record with a
        # key in it — is exercised here first.
        run: npm run test:release

      - name: Read-only preflight
        run: node scripts/devnet-escrow-custody.mjs

      - name: Funder preflight
        # Separate from the run, and before it, because the two failures it
        # catches are the ones that are expensive to discover late.
        #
        #   * A missing secret fails here, having created nothing.
        #   * A funder too thin for the full matrix fails here, rather than
        #     partway through — a run that stops between a `fund` and its
        #     settlement leaves tokens in a vault and burns an authorization
        #     that has to be granted again.
        #
        # It prints the funder's PUBLIC address and its balance. It prints
        # nothing else about it, and `set +x` is never lifted.
        if: ${{ !inputs.preflight_only }}
        env:
          PPV_CUSTODY_FUNDER: ${{ runner.temp }}/custody-funder.json
          PPV_CUSTODY_FUNDER_SECRET: ${{ secrets.PPV_CUSTODY_FUNDER_KEYPAIR }}
        run: |
          set -euo pipefail
          if [ -z "${PPV_CUSTODY_FUNDER_SECRET:-}" ]; then
            echo "::error::PPV_CUSTODY_FUNDER_KEYPAIR is not configured for the" \
                 "devnet-custody-validation environment. Add a DISPOSABLE devnet" \
                 "keypair there. Do not use the deployer or any custody signer." >&2
            exit 1
          fi
          # Written with no shell echo, read by the harness, removed in the
          # cleanup step below whatever happens.
          printf '%s' "${PPV_CUSTODY_FUNDER_SECRET}" > "${PPV_CUSTODY_FUNDER}"
          chmod 600 "${PPV_CUSTODY_FUNDER}"
          # A file, not an inline `node -e`. The step that handles the one PPV
          # secret this workflow takes is the last place to keep code that can
          # only be tested by regex-extracting it back out of this YAML.
          node scripts/funder-preflight.mjs

      - name: Live custody run
        if: ${{ !inputs.preflight_only }}
        env:
          PPV_COMMIT_SHA: ${{ github.sha }}
          PPV_CUSTODY_FUNDER: ${{ runner.temp }}/custody-funder.json
        run: node scripts/devnet-escrow-custody.mjs --execute

      - name: Remove the funder keypair
        if: always()
        run: rm -f "${{ runner.temp }}/custody-funder.json"

      - name: Refuse to publish an artifact containing key material
        # Scans BOTH directories, and runs whatever happened: a failed run
        # produces a diagnostic, and a diagnostic is uploaded, so it is held to
        # the same rule as evidence. The RPC URL is in the pattern because a
        # dedicated endpoint carries a credential in the URL itself.
        if: ${{ always() && !inputs.preflight_only }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(deployments/validation/*.json deployments/diagnostics/*.json)
          for record in "${records[@]}"; do
            if grep -Eq '"(secretKey|secret_key|privateKey|private_key|keypair|mnemonic|seedPhrase|rpcEndpoint|rpcUrl)"' "${record}"; then
              echo "::error::${record} contains a secret-shaped field; refusing to publish it" >&2
              exit 1
            fi
            if grep -Eq 'https?://[^"]*[?&](api-?key|token|apikey)=' "${record}"; then
              echo "::error::${record} contains a credential-bearing URL; refusing to publish it" >&2
              exit 1
            fi
          done

      - name: Require that a successful run produced evidence
        if: ${{ success() && !inputs.preflight_only }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(deployments/validation/*.json)
          if [ ${#records[@]} -eq 0 ]; then
            echo "::error::the run reported success but wrote no evidence record" >&2
            exit 1
          fi

      - name: Upload the validation evidence
        # Success only. Evidence means the matrix completed; a partial run has
        # a diagnostic instead, uploaded separately below under a name nobody
        # can mistake for this one.
        if: ${{ success() && !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ppv-escrow-devnet-custody-validation
          path: deployments/validation/*.json
          if-no-files-found: error

      - name: Upload the failure diagnostic
        # `always()`, because the run this matters for is the one that failed.
        # Run 35430583241 reached ten successful lifecycles and uploaded
        # nothing, leaving the operator a log and no account state.
        #
        # This is NOT validation evidence: different artifact name, different
        # directory, and the record's own first field says so.
        if: ${{ always() && !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ppv-escrow-devnet-custody-failure-diagnostic
          path: deployments/diagnostics/*.json
          if-no-files-found: ignore
