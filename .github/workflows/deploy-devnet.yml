name: Deploy devnet

# Manual only. There is no push, pull_request or schedule trigger here by
# design: a deployment must never be a side effect of merging code.
#
# The `devnet` environment must be configured in repository settings with
# environment-scoped secrets and variables. Native required-reviewer protection
# is unavailable for this repository configuration, so this workflow requires
# two independent Squads-member approvals as the compensating gate. Without
# those controls, this is an ordinary job with credentials, which the runbook
# forbids. See docs/devnet-deployment.md and docs/devnet-release-approval.md.
on:
  workflow_dispatch:
    inputs:
      program:
        description: Program to deploy
        required: true
        type: choice
        options: [ppv_core, ppv_commerce]
      confirm:
        description: Type the program name again to confirm
        required: true
        type: string
      verify_only:
        description: "Run all devnet release checks but stop before deployment"
        required: false
        default: true
        type: boolean
      approver_1:
        description: Squads member public key for approval 1
        required: true
        type: string

      signature_1:
        description: Base64 Ed25519 signature for approval 1
        required: true
        type: string

      approver_2:
        description: Squads member public key for approval 2
        required: true
        type: string

      signature_2:
        description: Base64 Ed25519 signature for approval 2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One deployment at a time. Concurrent initial deploys can race on the
  # deployer balance and produce incomplete evidence.
  group: deploy-devnet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.program }} to devnet
    runs-on: ubuntu-latest
    environment: devnet
    timeout-minutes: 60
    steps:
      - name: Confirm the program name
        run: |
          if [[ "${{ inputs.program }}" != "${{ inputs.confirm }}" ]]; then
            echo "Confirmation does not match the selected program." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup toolchain install 1.79.0 --profile minimal
          rustup toolchain install nightly-2024-06-15 --profile minimal

      - name: Install Solana CLI 1.18.17
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> "${GITHUB_PATH}"

      - name: Install Anchor CLI 0.30.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config
          cargo +1.79.0 install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.30.1 anchor-cli --locked --force

      - run: npm ci

      - name: Repository and identity preflight
        run: |
          # Repo and identity checks only: the toolchain, Squads and cluster
          # checks are made by the steps below, against this run's own
          # environment rather than a machine's ambient configuration.
          ./scripts/verify-devnet-readiness.sh --repo-only

      - name: Confirm the CLI is targeting devnet
        run: |
          solana config set --url https://api.devnet.solana.com
          solana config get
          expected="${{ vars.PPV_DEVNET_GENESIS_HASH }}"
          if [[ -z "${expected}" ]]; then
            echo "PPV_DEVNET_GENESIS_HASH must be set on the devnet environment." >&2
            exit 1
          fi
          actual="$(solana genesis-hash)"
          if [[ "${expected}" != "${actual}" ]]; then
            echo "Genesis hash ${actual} does not match the configured devnet genesis." >&2
            exit 1
          fi
          echo "genesis=${actual}"

      - name: Fetch ppv_core signing material
        if: inputs.program == 'ppv_core'
        id: core_keys
        env:
          PROGRAM_KEYPAIR: ${{ secrets.PPV_CORE_PROGRAM_KEYPAIR }}
          DEPLOYER_KEYPAIR: ${{ secrets.PPV_DEPLOYER_KEYPAIR }}
        run: |
          if [[ -z "${PROGRAM_KEYPAIR}" ]]; then
            echo "PPV_CORE_PROGRAM_KEYPAIR must be set on the devnet environment." >&2
            exit 1
          fi
          if [[ -z "${DEPLOYER_KEYPAIR}" ]]; then
            echo "PPV_DEPLOYER_KEYPAIR must be set on the devnet environment." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          echo "work=${work}" >> "${GITHUB_OUTPUT}"
          umask 077
          printf '%s' "${PROGRAM_KEYPAIR}" > "${work}/ppv_core-keypair.json"
          printf '%s' "${DEPLOYER_KEYPAIR}" > "${work}/deployer.json"
          # Only public keys are printed.
          echo "program address: $(solana-keygen pubkey "${work}/ppv_core-keypair.json")"
          echo "deployer:        $(solana-keygen pubkey "${work}/deployer.json")"

      - name: Fetch ppv_commerce signing material
        if: inputs.program == 'ppv_commerce'
        id: commerce_keys
        env:
          PROGRAM_KEYPAIR: ${{ secrets.PPV_COMMERCE_PROGRAM_KEYPAIR }}
          DEPLOYER_KEYPAIR: ${{ secrets.PPV_DEPLOYER_KEYPAIR }}
        run: |
          if [[ -z "${PROGRAM_KEYPAIR}" ]]; then
            echo "PPV_COMMERCE_PROGRAM_KEYPAIR must be set on the devnet environment." >&2
            exit 1
          fi
          if [[ -z "${DEPLOYER_KEYPAIR}" ]]; then
            echo "PPV_DEPLOYER_KEYPAIR must be set on the devnet environment." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          echo "work=${work}" >> "${GITHUB_OUTPUT}"
          umask 077
          printf '%s' "${PROGRAM_KEYPAIR}" > "${work}/ppv_commerce-keypair.json"
          printf '%s' "${DEPLOYER_KEYPAIR}" > "${work}/deployer.json"
          # Only public keys are printed.
          echo "program address: $(solana-keygen pubkey "${work}/ppv_commerce-keypair.json")"
          echo "deployer:        $(solana-keygen pubkey "${work}/deployer.json")"

      - name: Select the isolated signing directory
        id: keys
        env:
          CORE_WORK: ${{ steps.core_keys.outputs.work }}
          COMMERCE_WORK: ${{ steps.commerce_keys.outputs.work }}
        run: |
          work="${CORE_WORK:-${COMMERCE_WORK}}"
          if [[ -z "${work}" || ! -d "${work}" ]]; then
            echo "The selected program's signing directory was not created." >&2
            exit 1
          fi
          echo "work=${work}" >> "${GITHUB_OUTPUT}"

      - name: Assert committed identity and build
        id: release_identity
        run: |
          program="${{ inputs.program }}"
          mkdir -p target/deploy
          cp "${{ steps.keys.outputs.work }}/${program}-keypair.json" "target/deploy/${program}-keypair.json"

          keypair_id="$(solana-keygen pubkey "target/deploy/${program}-keypair.json")"
          declared_id="$(sed -n 's/^declare_id!("\(.*\)");$/\1/p' "programs/${program}/src/lib.rs")"
          mapfile -t anchor_ids < <(sed -n "s/^${program} = \"\(.*\)\"$/\1/p" Anchor.toml | sort -u)

          if [[ -z "${declared_id}" || "${#anchor_ids[@]}" -ne 1 ]]; then
            echo "Could not resolve one committed identity for ${program}." >&2
            exit 1
          fi
          if [[ "${keypair_id}" != "${declared_id}" || "${keypair_id}" != "${anchor_ids[0]}" ]]; then
            echo "Permanent keypair ${keypair_id} does not match committed ${program} identity." >&2
            echo "declare_id!: ${declared_id}" >&2
            echo "Anchor.toml: ${anchor_ids[0]}" >&2
            echo "Synchronize and commit the public program IDs before deployment." >&2
            exit 1
          fi

          RUSTUP_TOOLCHAIN=nightly-2024-06-15 anchor build

          idl_id="$(node -e "process.stdout.write(require('./target/idl/${program}.json').address)")"
          if [[ "${keypair_id}" != "${idl_id}" ]]; then
            echo "Built IDL id ${idl_id} does not match keypair ${keypair_id}." >&2
            exit 1
          fi
          git diff --exit-code -- Anchor.toml "programs/${program}/src/lib.rs"
          echo "program_id=${keypair_id}" >> "${GITHUB_OUTPUT}"
          echo "program id: ${keypair_id}"

      - name: Verify independent devnet release approvals
        env:
          PPV_RELEASE_PROGRAM: ${{ inputs.program }}
          PPV_RELEASE_PROGRAM_ID: ${{ steps.release_identity.outputs.program_id }}
          PPV_RELEASE_COMMIT: ${{ github.sha }}

          PPV_RELEASE_APPROVER_1: ${{ inputs.approver_1 }}
          PPV_RELEASE_SIGNATURE_1: ${{ inputs.signature_1 }}
          PPV_RELEASE_APPROVER_2: ${{ inputs.approver_2 }}
          PPV_RELEASE_SIGNATURE_2: ${{ inputs.signature_2 }}

          PPV_SQUADS_VAULT_PDA: ${{ vars.PPV_SQUADS_VAULT_PDA }}
          PPV_SQUADS_MEMBER_PUBKEYS: ${{ vars.PPV_SQUADS_MEMBER_PUBKEYS }}
          PPV_SQUADS_THRESHOLD: ${{ vars.PPV_SQUADS_THRESHOLD }}
        run: |
          node scripts/verify-devnet-release-approval.mjs

      - name: Refuse an existing program address
        run: |
          program="${{ inputs.program }}"
          program_id="$(solana-keygen pubkey "target/deploy/${program}-keypair.json")"

          # A program with a committed devnet release record has already had its
          # initial deployment. This is checked before the chain, and off a file
          # in the repository, so the refusal does not depend on an RPC call
          # succeeding: PPV Core's initial deployment is complete and this
          # workflow must never run against it again. A future change to a
          # released program is an upgrade through Squads — see
          # docs/ppv-core-upgrade-runbook.md — not a rerun of this workflow.
          for record in deployments/evidence/*.json; do
            [[ -f "${record}" ]] || continue
            recorded="$(node -e "
              const r = require('./' + process.argv[1]);
              process.stdout.write(r.cluster === 'devnet' ? String(r.program) : '');
            " "${record}")"
            if [[ "${recorded}" == "${program}" ]]; then
              echo "${program} has a committed devnet release record (${record})." >&2
              echo "Its initial deployment is COMPLETE. Redeploying is invalid; use the upgrade path." >&2
              exit 1
            fi
          done

          # Then the chain, read without a signer so this cannot fail for the
          # reason the post-deploy evidence step once did. An RPC error is not
          # evidence that the address is free, so it fails closed.
          state="$(node scripts/query-chain.mjs program "${program_id}" https://api.devnet.solana.com)" || {
            echo "Could not read ${program_id} from devnet. Refusing to deploy on an unknown state." >&2
            exit 1
          }
          exists="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).exists))" "${state}")"
          if [[ "${exists}" != "false" ]]; then
            echo "${program_id} already exists. This initial-deployment workflow will not upgrade it." >&2
            exit 1
          fi

      - name: Validate the configured final upgrade authority
        env:
          UPGRADE_AUTHORITY: ${{ vars.PPV_SQUADS_VAULT_PDA }}
          AUTHORITY_MEMBERS: ${{ vars.PPV_SQUADS_MEMBER_PUBKEYS }}
          AUTHORITY_THRESHOLD: ${{ vars.PPV_SQUADS_THRESHOLD }}
        run: |
          # Checked before deployment, so a misconfigured authority never
          # becomes the thing that owns the program.
          if [[ -z "${UPGRADE_AUTHORITY}" ]]; then
            echo "PPV_SQUADS_VAULT_PDA must be set as a devnet environment variable." >&2
            exit 1
          fi
          if [[ -z "${AUTHORITY_MEMBERS}" || -z "${AUTHORITY_THRESHOLD}" ]]; then
            echo "PPV_SQUADS_MEMBER_PUBKEYS and PPV_SQUADS_THRESHOLD must be set." >&2
            exit 1
          fi
          if ! [[ "${AUTHORITY_THRESHOLD}" =~ ^[0-9]+$ ]] || (( AUTHORITY_THRESHOLD < 2 )); then
            echo "PPV_SQUADS_THRESHOLD is '${AUTHORITY_THRESHOLD}'; policy requires at least 2." >&2
            echo "A threshold of one means a single compromised key can upgrade the program." >&2
            exit 1
          fi
          # A Squads vault is a program-derived address and is therefore off the
          # ed25519 curve. An on-curve address is somebody's wallet.
          on_curve="$(node --input-type=module -e "
            import { isProgramDerived } from './scripts/lib/pubkey.mjs';
            process.stdout.write(String(!isProgramDerived(process.argv[1])));
          " -- "${UPGRADE_AUTHORITY}")"
          if [[ "${on_curve}" != "false" ]]; then
            echo "PPV_SQUADS_VAULT_PDA is not a program-derived address." >&2
            echo "Refusing to hand the upgrade authority to a signer wallet." >&2
            exit 1
          fi
          echo "final upgrade authority: ${UPGRADE_AUTHORITY} (off-curve, threshold ${AUTHORITY_THRESHOLD})"

      - name: Verify deployer funding
        if: ${{ !inputs.verify_only }}
        env:
          MIN_DEPLOYER_LAMPORTS: "2000000000"
        run: |
          deployer="$(solana-keygen pubkey "${{ steps.keys.outputs.work }}/deployer.json")"
          balance_lamports="$(
            curl -fsS https://api.devnet.solana.com \
              -X POST -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"${deployer}\",{\"commitment\":\"confirmed\"}]}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.error||!j.result)process.exit(1);process.stdout.write(String(j.result.value))})'
          )"
          if ! [[ "${balance_lamports}" =~ ^[0-9]+$ ]]; then
            echo "Could not determine deployer balance from devnet." >&2
            exit 1
          fi
          if (( balance_lamports < MIN_DEPLOYER_LAMPORTS )); then
            echo "Deployer ${deployer} has ${balance_lamports} lamports; at least ${MIN_DEPLOYER_LAMPORTS} are required before deployment." >&2
            exit 1
          fi
          node -e 'console.log(`deployer balance: ${Number(process.argv[1]) / 1e9} SOL`)' "${balance_lamports}"

      - name: Stop after verification
        if: ${{ inputs.verify_only }}
        run: |
          echo "VERIFY-ONLY: all pre-deployment checks passed."
          echo "No program deployment or authority transfer was attempted."
          exit 0

      - name: Deploy with the deployer as temporary authority
        if: ${{ !inputs.verify_only }}
        id: deploy
        run: |
          program="${{ inputs.program }}"
          program_id="$(solana-keygen pubkey "target/deploy/${program}-keypair.json")"
          deploy_log="${{ steps.keys.outputs.work }}/solana-program-deploy.log"
          if ! solana program deploy \
            --url https://api.devnet.solana.com \
            --keypair "${{ steps.keys.outputs.work }}/deployer.json" \
            --program-id "target/deploy/${program}-keypair.json" \
            --upgrade-authority "${{ steps.keys.outputs.work }}/deployer.json" \
            "target/deploy/${program}.so" >"${deploy_log}" 2>&1; then
            echo "Solana program deploy failed. Raw CLI output was suppressed because Solana CLI may print temporary buffer recovery material on failure." >&2
            echo "program id: ${program_id}" >&2
            echo "Review public devnet state and deployer funding before retrying; do not expose or reuse any temporary buffer recovery phrase." >&2
            exit 1
          fi
          rm -f "${deploy_log}"

          # `solana program deploy` prints only the program id, never the deploy
          # transaction signature — in both its text output and `--output json`
          # form on the pinned Solana CLI 1.18.17. Read the signature back from
          # the chain instead. This step runs before the authority handoff, so
          # the newest signature on the program account is the deploy itself.
          # Query at confirmed commitment because the just-deployed transaction
          # is confirmed but not yet finalized, and retry briefly to absorb RPC
          # indexing lag.
          signature=""
          for _ in $(seq 1 10); do
            signature="$(
              curl -fsS https://api.devnet.solana.com \
                -X POST -H 'Content-Type: application/json' \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getSignaturesForAddress\",\"params\":[\"${program_id}\",{\"limit\":1,\"commitment\":\"confirmed\"}]}" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s)||{}).result;process.stdout.write(r&&r[0]?r[0].signature:"")})'
            )"
            [[ -n "${signature}" ]] && break
            sleep 3
          done
          if [[ -z "${signature}" ]]; then
            echo "Deployment succeeded but its signature could not be read from the chain." >&2
            exit 1
          fi
          echo "signature=${signature}" >> "${GITHUB_OUTPUT}"

      - name: Transfer upgrade authority to Squads
        if: ${{ !inputs.verify_only }}
        id: transfer
        env:
          UPGRADE_AUTHORITY: ${{ vars.PPV_SQUADS_VAULT_PDA }}
        run: |
          if [[ -z "${UPGRADE_AUTHORITY}" ]]; then
            echo "PPV_SQUADS_VAULT_PDA must be set as a devnet environment variable." >&2
            exit 1
          fi
          program_id="$(solana-keygen pubkey "target/deploy/${{ inputs.program }}-keypair.json")"
          # A Squads vault PDA cannot sign the checked authority-transfer form.
          # Solana CLI 1.18.17 supports an unchecked transfer to a public key;
          # the current deployer authority still signs the transaction.
          solana program set-upgrade-authority "${program_id}" \
            --url https://api.devnet.solana.com \
            --keypair "${{ steps.keys.outputs.work }}/deployer.json" \
            --upgrade-authority "${{ steps.keys.outputs.work }}/deployer.json" \
            --new-upgrade-authority "${UPGRADE_AUTHORITY}" \
            --skip-new-upgrade-authority-signer-check

          # The transfer signature is part of the release evidence, so it is read
          # back here rather than hunted for afterwards. It lands on the
          # ProgramData account, not the program account — the program account's
          # newest signature is still the deploy — so query ProgramData. Read at
          # confirmed commitment with a short retry, for the same RPC indexing
          # lag the deploy step allows for.
          program_data="$(
            node scripts/query-chain.mjs program "${program_id}" https://api.devnet.solana.com \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).programDataAddress||"")})'
          )"
          transfer_signature=""
          if [[ -n "${program_data}" ]]; then
            for _ in $(seq 1 10); do
              transfer_signature="$(
                curl -fsS https://api.devnet.solana.com \
                  -X POST -H 'Content-Type: application/json' \
                  -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getSignaturesForAddress\",\"params\":[\"${program_data}\",{\"limit\":1,\"commitment\":\"confirmed\"}]}" \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s)||{}).result;process.stdout.write(r&&r[0]?r[0].signature:"")})'
              )"
              [[ -n "${transfer_signature}" ]] && break
              sleep 3
            done
          fi
          # Not fatal on its own: the transfer already succeeded, and the next
          # step verifies the live authority regardless. A missing signature
          # means the record is written without it, never that the release is
          # rolled back — Sprint 1's lesson is that evidence trouble after a
          # successful handoff is repaired, not redeployed.
          echo "transfer_signature=${transfer_signature}" >> "${GITHUB_OUTPUT}"

      - name: Verify on chain and record the deployment
        if: ${{ !inputs.verify_only }}
        env:
          EXPECTED_AUTHORITY: ${{ vars.PPV_SQUADS_VAULT_PDA }}
          AUTHORITY_MEMBERS: ${{ vars.PPV_SQUADS_MEMBER_PUBKEYS }}
          AUTHORITY_THRESHOLD: ${{ vars.PPV_SQUADS_THRESHOLD }}
          DEPLOY_SIGNATURE: ${{ steps.deploy.outputs.signature }}
        run: |
          if [[ -z "${AUTHORITY_MEMBERS}" || -z "${AUTHORITY_THRESHOLD}" ]]; then
            echo "PPV_SQUADS_MEMBER_PUBKEYS and PPV_SQUADS_THRESHOLD must be set." >&2
            exit 1
          fi
          if ! [[ "${AUTHORITY_THRESHOLD}" =~ ^[0-9]+$ ]] || (( AUTHORITY_THRESHOLD < 2 )); then
            echo "Refusing to record a deployment with threshold '${AUTHORITY_THRESHOLD}'." >&2
            exit 1
          fi
          program="${{ inputs.program }}"
          program_id="$(solana-keygen pubkey "target/deploy/${program}-keypair.json")"

          # Read through JSON-RPC, not the Solana CLI. The CLI expects a
          # configured default signer even for read-only commands, and on a
          # runner that has none it fails — which is how PPV Core's first
          # deployment succeeded on chain and still reported failure, leaving
          # the release with no evidence. Verification of public state must not
          # depend on the ability to sign.
          state="$(node scripts/query-chain.mjs program "${program_id}" https://api.devnet.solana.com)"
          field() { node -e "process.stdout.write(String(JSON.parse(process.argv[1])[process.argv[2]] ?? ''))" "${state}" "$1"; }
          actual_authority="$(field upgradeAuthority)"
          if [[ "${actual_authority}" != "${EXPECTED_AUTHORITY}" ]]; then
            echo "Authority handoff failed: expected ${EXPECTED_AUTHORITY}, got ${actual_authority}." >&2
            exit 1
          fi

          if [[ "$(field executable)" != "true" || "$(field owner)" != "BPFLoaderUpgradeab1e11111111111111111111111" ]]; then
            echo "Program account is not an executable upgradeable-loader program." >&2
            exit 1
          fi

          PPV_PROGRAM="${program}" \
          PPV_DEPLOY_SIGNATURE="${DEPLOY_SIGNATURE}" \
          PPV_UPGRADE_AUTHORITY_MEMBERS="${AUTHORITY_MEMBERS}" \
          PPV_UPGRADE_AUTHORITY_THRESHOLD="${AUTHORITY_THRESHOLD}" \
          PPV_VERIFIABLE=false \
          PPV_RPC_URL=https://api.devnet.solana.com \
            ./scripts/record-deployment.sh
          ./scripts/verify-deployment.sh
          sha256sum "target/idl/${program}.json" "target/deploy/${program}.so"

      # The canonical release record, written by the deployment that produced it.
      #
      # Sprint 1 shipped PPV Core and then had to reconstruct its record from the
      # chain weeks later, because the record was a manual step after the
      # workflow rather than part of it. This is that step, moved inside. It
      # gates on the built artifact being byte-identical to the bytes the loader
      # is holding, so the record cannot describe a binary that is not deployed.
      - name: Write and verify the canonical release record
        if: ${{ !inputs.verify_only }}
        env:
          AUTHORITY_MEMBERS: ${{ vars.PPV_SQUADS_MEMBER_PUBKEYS }}
          AUTHORITY_THRESHOLD: ${{ vars.PPV_SQUADS_THRESHOLD }}
          DEPLOY_SIGNATURE: ${{ steps.deploy.outputs.signature }}
          TRANSFER_SIGNATURE: ${{ steps.transfer.outputs.transfer_signature }}
        run: |
          program="${{ inputs.program }}"
          short="$(git rev-parse --short=7 HEAD)"
          record="deployments/evidence/${program//_/-}-devnet-${short}.json"
          mkdir -p deployments/evidence

          PPV_PROGRAM="${program}" \
          PPV_RELEASE_COMMIT="$(git rev-parse HEAD)" \
          PPV_DEPLOY_SIGNATURE="${DEPLOY_SIGNATURE}" \
          PPV_AUTHORITY_TRANSFER_SIGNATURE="${TRANSFER_SIGNATURE}" \
          PPV_UPGRADE_AUTHORITY_MEMBERS="${AUTHORITY_MEMBERS}" \
          PPV_UPGRADE_AUTHORITY_THRESHOLD="${AUTHORITY_THRESHOLD}" \
          PPV_SOURCE_WORKFLOW_RUN="${{ github.run_id }}" \
          PPV_RPC_URL=https://api.devnet.solana.com \
            node scripts/collect-deployment-evidence.mjs "${record}"

          node scripts/verify-deployed-program.mjs "${record}"
          echo "RECORD=${record}" >> "${GITHUB_ENV}"
          echo
          echo "Commit ${record} and delete deployments/release-candidates/${program}.json."
          echo "Committing it retires the initial deployment for ${program}."

      - name: Upload public deployment evidence
        if: ${{ !inputs.verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ppv-devnet-${{ inputs.program }}-evidence
          path: |
            deployments/devnet.json
            deployments/evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy signing material
        if: always()
        run: |
          # Runs even when an earlier step failed, so a partial run never leaves
          # keypairs on the runner disk.
          rm -rf "${{ steps.keys.outputs.work }}" target/deploy/*-keypair.json
