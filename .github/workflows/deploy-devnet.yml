name: Deploy devnet

# Manual only. There is no push, pull_request or schedule trigger here by
# design: a deployment must never be a side effect of merging code.
#
# The `devnet` environment must be configured in repository settings with
# required reviewers and environment-scoped secrets. Without that, this workflow
# is just an ordinary job with credentials, which is exactly what the runbook
# forbids. See docs/devnet-deployment.md.
on:
  workflow_dispatch:
    inputs:
      program:
        description: Program to deploy
        required: true
        type: choice
        options: [ppv_core, ppv_commerce]
      confirm:
        description: Type the program name again to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One deployment at a time. Two concurrent deploys of the same program race on
  # the write buffer and can leave it half-written.
  group: deploy-devnet-${{ inputs.program }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.program }} to devnet
    runs-on: ubuntu-latest
    environment: devnet
    timeout-minutes: 60
    steps:
      - name: Confirm the program name
        run: |
          if [[ "${{ inputs.program }}" != "${{ inputs.confirm }}" ]]; then
            echo "Confirmation does not match the selected program." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup toolchain install 1.79.0 --profile minimal
          rustup toolchain install nightly-2024-06-15 --profile minimal

      - name: Install Solana CLI 1.18.17
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> "${GITHUB_PATH}"

      - name: Install Anchor CLI 0.30.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config
          cargo +1.79.0 install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.30.1 anchor-cli --locked --force

      - run: npm ci

      - name: Confirm the CLI is targeting devnet
        run: |
          solana config set --url https://api.devnet.solana.com
          solana config get
          # Refuse to continue against anything but devnet's genesis.
          expected="${{ vars.PPV_DEVNET_GENESIS_HASH }}"
          actual="$(solana genesis-hash)"
          if [[ -n "${expected}" && "${expected}" != "${actual}" ]]; then
            echo "Genesis hash ${actual} does not match the configured devnet genesis." >&2
            exit 1
          fi
          echo "genesis=${actual}"

      - name: Fetch signing material
        id: keys
        env:
          # Environment-scoped secrets. They exist only for this step's process
          # and are written to a temporary directory outside the repository.
          PROGRAM_KEYPAIR: ${{ secrets.PPV_PROGRAM_KEYPAIR }}
          DEPLOYER_KEYPAIR: ${{ secrets.PPV_DEPLOYER_KEYPAIR }}
        run: |
          if [[ -z "${PROGRAM_KEYPAIR}" || -z "${DEPLOYER_KEYPAIR}" ]]; then
            echo "PPV_PROGRAM_KEYPAIR and PPV_DEPLOYER_KEYPAIR must be set on the devnet environment." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          echo "work=${work}" >> "${GITHUB_OUTPUT}"
          umask 077
          printf '%s' "${PROGRAM_KEYPAIR}"  > "${work}/${{ inputs.program }}-keypair.json"
          printf '%s' "${DEPLOYER_KEYPAIR}" > "${work}/deployer.json"
          # Only public keys are ever printed.
          echo "program address: $(solana-keygen pubkey "${work}/${{ inputs.program }}-keypair.json")"
          echo "deployer:        $(solana-keygen pubkey "${work}/deployer.json")"

      - name: Sync program ids and build
        run: |
          mkdir -p target/deploy
          cp "${{ steps.keys.outputs.work }}/${{ inputs.program }}-keypair.json" target/deploy/
          # The other program needs a keypair present for `anchor keys sync` to
          # run, but it is ephemeral and never deployed by this job.
          for other in ppv_core ppv_commerce; do
            [[ "${other}" == "${{ inputs.program }}" ]] && continue
            [[ -f "target/deploy/${other}-keypair.json" ]] ||
              solana-keygen new --silent --no-bip39-passphrase --outfile "target/deploy/${other}-keypair.json"
          done
          anchor keys sync
          RUSTUP_TOOLCHAIN=nightly-2024-06-15 anchor build

      - name: Assert the built id matches the deployment keypair
        run: |
          keypair_id="$(solana-keygen pubkey "target/deploy/${{ inputs.program }}-keypair.json")"
          idl_id="$(node -e "process.stdout.write(require('./target/idl/${{ inputs.program }}.json').address)")"
          if [[ "${keypair_id}" != "${idl_id}" ]]; then
            echo "Built id ${idl_id} does not match keypair ${keypair_id}." >&2
            exit 1
          fi
          echo "program id: ${keypair_id}"

      - name: Deploy
        env:
          UPGRADE_AUTHORITY: ${{ vars.PPV_SQUADS_VAULT_PDA }}
        run: |
          if [[ -z "${UPGRADE_AUTHORITY}" ]]; then
            echo "PPV_SQUADS_VAULT_PDA must be set as a devnet environment variable." >&2
            exit 1
          fi
          solana program deploy \
            --url https://api.devnet.solana.com \
            --keypair "${{ steps.keys.outputs.work }}/deployer.json" \
            --program-id "target/deploy/${{ inputs.program }}-keypair.json" \
            --upgrade-authority "${UPGRADE_AUTHORITY}" \
            "target/deploy/${{ inputs.program }}.so"

      - name: Verify on chain
        run: |
          program_id="$(solana-keygen pubkey "target/deploy/${{ inputs.program }}-keypair.json")"
          solana program show "${program_id}" --url https://api.devnet.solana.com
          sha256sum "target/idl/${{ inputs.program }}.json" "target/deploy/${{ inputs.program }}.so"

      - name: Destroy signing material
        if: always()
        run: |
          # Runs even when an earlier step failed, so a partial run never leaves
          # keypairs on the runner disk.
          rm -rf "${{ steps.keys.outputs.work }}" target/deploy/*-keypair.json
