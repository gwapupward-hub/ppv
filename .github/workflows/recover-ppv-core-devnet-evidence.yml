name: Recover PPV Core devnet evidence

# Read-only recovery of the canonical evidence record for the PPV Core initial
# devnet deployment (workflow run 34725816827). That run deployed the program
# and transferred upgrade authority to Squads successfully, then failed in the
# step that was supposed to write the evidence down: its post-deploy verifier
# used a Solana CLI path that expects a default signer, and the GitHub runner
# has none. The deployment is real; only the paperwork was lost.
#
# This workflow rebuilds the exact release commit and reconstructs the record
# from public chain state. It cannot deploy, upgrade, close a program, transfer
# authority, or submit any transaction: it uses no repository secrets, no
# keypair and no Solana CLI subcommand at all — every chain read is raw
# JSON-RPC. The hard gate is the binary comparison: the rebuild must equal the
# bytes the loader is holding, or the run fails and writes nothing.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ppv_core to run read-only recovery verification
        required: true
        type: string
  # The original failure was evidence tooling that no run had ever exercised, so
  # a change to that tooling exercises it here, on the pull request that makes
  # the change. Read-only, so this is safe to run automatically; the confirmation
  # input exists for the manual path and is not required for a pull request.
  pull_request:
    paths:
      - .github/workflows/recover-ppv-core-devnet-evidence.yml
      - scripts/collect-deployment-evidence.mjs
      - scripts/verify-deployed-program.mjs
      - scripts/lib/rpc.mjs
      - scripts/lib/pubkey.mjs

permissions:
  contents: read

concurrency:
  group: recover-ppv-core-devnet-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Recover PPV Core devnet evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PPV_RPC_URL: https://api.devnet.solana.com
      PPV_PROGRAM: ppv_core
      PROGRAM_ID: 9cWE41ZDNQChvFrRoVuPQDeoVLg46ACTiZRCZaBZzfwU
      PPV_RELEASE_COMMIT: 861a8dfce9533f75494621b8a36e60e60447cc0c
      PPV_DEPLOY_SIGNATURE: 3A1fMmAZiBfjKb9ijUW81KaqEyZqEtT7vha2Ms2hZanxhjcDaJn4wKJvEwSkDJBK3Co7eJnTyn6wvc2iXaYaAxAp
      PPV_AUTHORITY_TRANSFER_SIGNATURE: 5TX9vvX5ktHE19mDZw5VXkNajZESrPxQZGqxQ26B5pzrLhuVPELTaB8KTsKXCUmpvNzv9FCj2JpHR8Re3jiuTwgj
      PPV_UPGRADE_AUTHORITY_MEMBERS: 58kuGbxpvaamvYE44WYkyipBB6FVKt2qT9u3vAKtyKYV,2FFVcm9xJmUHG6zfo15ktzuGQTXACPG42iquGHe6faTN,BJmFM4k7Q32CiCYSdoYkAhXdD5Sk3BegMh2cbEAsgSwJ
      PPV_UPGRADE_AUTHORITY_THRESHOLD: "2"
      PPV_SOURCE_WORKFLOW_RUN: "34725816827"

    steps:
      - name: Confirm read-only recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.confirm }}" != "${PPV_PROGRAM}" ]]; then
            echo "Confirmation must be exactly '${PPV_PROGRAM}'." >&2
            exit 1
          fi
          echo "Read-only recovery only. No deployment or authority mutation is possible here."

      # The release commit, not this branch: the record must describe the source
      # that was actually deployed.
      - name: Check out the exact deployed release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PPV_RELEASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: release

      # The recovery tooling itself comes from the branch being run, so a fix to
      # the verifier does not require rewriting release history.
      - name: Check out the recovery tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: tooling

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup toolchain install 1.79.0 --profile minimal
          rustup toolchain install nightly-2024-06-15 --profile minimal

      - name: Install Solana platform tools 1.18.17
        run: |
          solana_bin="${HOME}/.local/share/solana/install/active_release/bin"
          if [[ ! -x "${solana_bin}/cargo-build-sbf" ]]; then
            sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v1.18.17/install)"
          fi
          echo "${solana_bin}" >> "${GITHUB_PATH}"

      - name: Install Anchor CLI 0.30.1
        run: |
          if [[ ! -x "${HOME}/.cargo/bin/anchor" ]] || \
             [[ "$("${HOME}/.cargo/bin/anchor" --version)" != "anchor-cli 0.30.1" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libudev-dev pkg-config
            cargo +1.79.0 install \
              --git https://github.com/solana-foundation/anchor \
              --tag v0.30.1 anchor-cli --locked --force
          fi
          "${HOME}/.cargo/bin/anchor" --version

      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/bin/anchor
          key: ppv-anchor-0.30.1-solana-1.18.17-${{ runner.os }}-v3

      - name: Assert the release source binds ppv_core to its permanent identity
        working-directory: release
        run: |
          actual_commit="$(git rev-parse HEAD)"
          [[ "${actual_commit}" == "${PPV_RELEASE_COMMIT}" ]] || {
            echo "Checked out ${actual_commit}, expected ${PPV_RELEASE_COMMIT}." >&2
            exit 1
          }
          declared_id="$(sed -n 's/^declare_id!("\(.*\)");$/\1/p' "programs/${PPV_PROGRAM}/src/lib.rs")"
          mapfile -t anchor_ids < <(sed -n "s/^${PPV_PROGRAM} = \"\(.*\)\"$/\1/p" Anchor.toml | sort -u)
          if [[ "${declared_id}" != "${PROGRAM_ID}" || "${#anchor_ids[@]}" -ne 1 || "${anchor_ids[0]}" != "${PROGRAM_ID}" ]]; then
            echo "Release source does not bind ${PPV_PROGRAM} to ${PROGRAM_ID}." >&2
            exit 1
          fi

      - name: Rebuild the exact release artifact
        working-directory: release
        run: |
          RUSTUP_TOOLCHAIN=nightly-2024-06-15 anchor build
          ls -l "target/deploy/${PPV_PROGRAM}.so" "target/idl/${PPV_PROGRAM}.json"

      # The one step that decides whether this release can be closed: the
      # rebuild's bytes against the bytes the loader is holding, plus the
      # identity, custody and transaction checks around them.
      - name: Reconstruct the canonical evidence record
        env:
          PPV_EVIDENCE_WORKFLOW_RUN: ${{ github.run_id }}
          PPV_BUILD_DIR: release/target
        run: |
          mkdir -p evidence
          node tooling/scripts/collect-deployment-evidence.mjs \
            "evidence/ppv-core-devnet-${PPV_RELEASE_COMMIT:0:7}.json"

      - name: Re-verify the written record through the public verifier
        run: |
          node tooling/scripts/verify-deployed-program.mjs \
            "evidence/ppv-core-devnet-${PPV_RELEASE_COMMIT:0:7}.json"

      - name: Upload the recovered evidence record
        uses: actions/upload-artifact@v4
        with:
          name: ppv-core-devnet-recovered-evidence
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 90
