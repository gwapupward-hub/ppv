name: Temporary governance lockfile sync

# Migration-only helper for feat/native-ppv-governance. Delete this workflow as
# soon as it commits Cargo.lock; normal CI must never regenerate the lockfile.
on:
  push:
    branches: [feat/native-ppv-governance]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-ppv-governance
      - name: Install pinned host toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Regenerate with repository policy
        run: ./scripts/regenerate-lockfile.sh
      - name: Commit only Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync governance lockfile"
          git push origin HEAD:feat/native-ppv-governance
